    <style>
    .publications-container {
        max-width: 1400px;
        margin: 60px auto;
        padding: 0 30px;
    }

    .publications-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 30px;
    }

    .publication-card {
        position: relative;
        overflow: hidden;

        width: 100%;
        aspect-ratio: 16 / 7;

        background: #F7F5F2;
        border: 1px solid #111;
        transition: .35s;
    }

    .publication-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 18px 35px rgba(0,0,0,.12);
    }

    .publication-card-link {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        height: 100%;

        text-decoration: none;
        color: inherit;
    }

    .publication-content {
        position: relative;
        z-index: 2;

        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 40px;
        transition: .4s;

        transform: translateY(-15px);
    }

    .publication-title {
        font-family: "Lora", serif;
        font-size: 22px;
        font-weight: 500;

        margin-bottom: 40px;
    }

    .publication-description {
        max-width: 520px;

        color: #666;
        line-height: 1.7;
        font-size: 15px;
    }

    .publication-image {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        opacity: 0;
        transform: scale(1.08);

        transition: .45s;

        filter: brightness(.55);
    }

    .publication-card::after {
        content: "";

        position: absolute;
        inset: 0;

        background: rgba(0,0,0,.15);

        opacity: 0;

        transition: .45s;
    }

    .publication-card:hover .publication-image,
    .publication-card:active .publication-image {
        opacity: 1;
        transform: scale(1);
    }

    .publication-card:hover::after,
    .publication-card:active::after {
        opacity: 1;
    }

    .publication-card:hover .publication-content,
    .publication-card:active .publication-content {
        color: white;
    }

    .publication-card:hover .publication-description,
    .publication-card:active .publication-description {
        color: rgba(255,255,255,.9);
    }

    .contacts-list {
        margin-top: 80px;
    }

@media (max-width: 650px) {

    .publications-container {
        padding: 0 20px;
        margin: 40px auto;
    }

    .publications-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }



    .publication-content {
        padding: 22px;
        transform: translateY(-8px);
    }

    .publication-title {
        font-size: 15px;
        margin-bottom: 14px;
    }

    .publication-description {
        max-width: 100%;
        font-size: 10px;
        line-height: 1.45;
    }

    .contacts-list {
        margin-top: 50px;
    }

}
