<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты — RatkeDesign</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    padding: 40px 0;
    max-width: 1400px; 
    margin: 0 auto;
    width: 90%;
}

.project-card {
    background-color: #f9f9f9;
    border-radius: 12px;
    overflow: hidden;
    border: none;
    height: 580px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.project-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
}

.project-link {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.project-img {
    width: 100%;
    height: 480px;
    object-fit: contain;
    object-position: center;
    display: block;
}

.project-info {
    padding: 20px 10px;  
    background: transparent; 
    text-align: center;
    margin-top: auto;
}

.project-title {
    margin: 0;
    font-size: 24px;     
    font-weight: 600;    
    color: #1a1a1a; 
    letter-spacing: 0.5px;
}

@media (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
        gap: 30px;
    }
    .project-card {
        height: 430px;
    }
    .project-img {
        height: 350px; 
    }
    .project-title {
        font-size: 20px;
    }
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://lhreibskrvuarjfjlyom.supabase.co/storage/v1/object/public/projects-images/logo%20(1).png" class="logo-img">
        </div>
        <h1>RatkeDesign</h1>
        <nav class="menu">
            <a href="index.html" class="menu-href">Главная</a>
            <a href="projects.html" class="menu-href active-href">Проекты</a>
            <a href="publications.html" class="menu-href">Публикации</a>
            <a href="compound.html" class="menu-href">Состав проекта</a>
            <a href="contact.html" class="menu-href">Контакты</a>
        </nav>
    </header>
    <main>
        <div class="container">
        </div>
    </main>
</body>
</html>
