<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Проекты студии Ratke Design.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект — Ratke Design</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        #detailed-subtitle {
            margin: 0 0 20px 0;
            font-size: 17px;
            color: #8a8a8a;
            font-weight: normal;
        }

        .project-detail-container {
            max-width: 1200px; 
            margin: 50px auto;
            width: 90%;
            background-color: #f9f9f9;
            padding: 50px;
            box-sizing: border-box;
        }
        #detailed-title {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            text-align: left;
            font-family: "Lora", serif;
            font-style: italic;
            font-weight: normal;
        }
        #detailed-desc {
            margin: 0 0 40px 0;
            font-size: 20px;
            color: #666666;
            line-height: 1.6;
            max-width: 1000px;
            text-align: left;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 0;
            margin: 0 auto;
            width: 100%;
        }

        .gallery-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .gallery-img:hover {
            transform: scale(1.02);
        }

        @media (max-width: 900px) {
            .project-detail-container {
                border-radius: 25px;
                padding: 30px 20px;
                margin: 20px auto;
            }
            #detailed-title {
                font-size: 18px;
            }
            #detailed-desc {
                font-size: 18px;
                margin-bottom: 10px;
            }
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .gallery-img {
                height: 200px;
            }
        }


        .image-modal {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: rgba(0, 0, 0, 0.9) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            z-index: 9999 !important; 
            box-sizing: border-box !important;
            padding: 40px !important;
        }


        .image-modal-content {
            width: auto !important;
            height: auto !important;
            max-width: 80vw !important;
            max-height: 80vh !important;
            object-fit: contain !important;
            display: block !important;
            margin: auto !important;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: zoomAnimation 0.25s ease-out;
        }


        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .image-modal-close:hover {
            color: #bbb;
        }

        .btn-previous, .btn-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s ease;
        }

        .btn-previous { left: 40px; }
        .btn-next { right: 40px; }

        .btn-previous:hover, .btn-next:hover {
            color: #bbb;
            scale: 1.1;
        }
        @keyframes zoomAnimation {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            #detailed-subtitle {
                font-size: 13px;
            }

            .gallery-container {
                grid-template-columns: 1fr;
            }
            .gallery-img {
                height: 250px;
            }
            .btn-previous, .btn-next {
                top: auto;
                bottom: 20px; 
                transform: none;
                font-size: 40px;  
                padding: 10px 30px; 
                background-color: rgba(255, 255, 255, 0.1); 
                border-radius: 8px;
                backdrop-filter: blur(4px);
            }

            .btn-previous {
                left: calc(50% - 90px);
            }
            .btn-next {
                right: calc(50% - 90px);
                left: auto;
            }
            .image-modal {
                padding: 10px !important;
            }
            .image-modal-content {
                max-width: 95vw !important;
                max-height: 80vh !important;
                margin: 0 !important;
            }

            .btn-previous, .btn-next {
                top: auto !important;
                bottom: 30px !important; 
                transform: none !important;
                font-size: 40px;  
                padding: 10px 30px; 
                background-color: rgba(255, 255, 255, 0.2); 
                border-radius: 8px;
                backdrop-filter: blur(8px);
                z-index: 10001;
            }

            .btn-previous {
                left: calc(50% - 95px) !important;
            }
            .btn-next {
                right: calc(50% - 95px) !important;
                left: auto !important;
            }
            
            .btn-previous:hover, .btn-next:hover {
                transform: scale(1.05) !important;
            }

            .image-modal-close {
                top: 15px;
                right: 20px;
                font-size: 35px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/project-detail.js" defer></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://lhreibskrvuarjfjlyom.supabase.co/storage/v1/object/public/projects-images/logo%20(1).png" class="logo-img">
        </div>
        <nav class="menu">
            <a href="/" class="menu-href active-href">Главная</a>
            <a href="/publications" class="menu-href">Публикации</a>
            <a href="/compound" class="menu-href">Состав проекта</a>
            <a href="/contact" class="menu-href">Контакты</a>
        </nav>
    </header>
    <main>
        <div class="project-detail-container">
            <h1 id="detailed-title">Загрузка...</h1>
            <p id="detailed-subtitle"></p>

            <div class="gallery-container" id="gallery-container"></div>
        </div>            
    </main>
</body>
</html>
